<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English TTS POC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>English TTS Proof‑of‑Concept</h1>
  </header>

  <!-- Upload Card -->
  <section id="upload-card" class="card">
    <h2>Upload Document</h2>
    <input type="file" id="file-input" accept=".pdf,.docx,.png,.jpg,.jpeg" aria-label="Choose file to upload" />
    <button id="upload-btn" class="primary">Upload</button>
    <div id="upload-status" class="status hidden" aria-live="polite"></div>
    <div id="upload-spinner" class="spinner hidden" aria-hidden="true"></div>
  </section>

  <!-- Library -->
  <section id="library" class="card hidden">
    <h2>Library</h2>
    <ul id="document-list" class="list"></ul>
  </section>

  <!-- Chapter List -->
  <section id="chapters" class="card hidden">
    <h2>Chapters</h2>
    <ul id="chapter-list" class="list"></ul>
  </section>

  <!-- Transcript Panel -->
  <section id="transcript-panel" class="card hidden">
    <h2>Transcript</h2>
    <div id="transcript" class="transcript"></div>
  </section>

  <!-- Bottom Player Bar -->
  <footer id="player-bar" class="player hidden" aria-label="Audio player">
    <button id="prev-chapter" aria-label="Previous chapter">⏮️</button>
    <button id="play-pause" aria-label="Play/Pause">⏯️</button>
    <button id="next-chapter" aria-label="Next chapter">⏭️</button>
    <select id="playback-rate" aria-label="Playback speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <span id="current-title" class="title"></span>
    <audio id="audio-player" controls></audio>
  </footer>

  <script src="app.js"></script>
</body>
</html>
